http:
  routers:
    gateway:
      rule: "Host(`miicel.local`)"
      service: gateway
      entryPoints: [web]
    auth:
      rule: "Host(`auth.miicel.local`)"
      service: auth
      entryPoints: [web]

  services:
    gateway:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5003"
    auth:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5000"
